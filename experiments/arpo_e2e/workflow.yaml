schema_version: "0.3"
topology: centralized
entry_agent: planner
hub:
  role: planner
  skills: []
  verify: null
  max_feedback_hops: 1
  system_prompt: ''
tools: [wikipedia_search, google_search, web_search, python_coder, think]
llm:
  kind: api
  model: Qwen3-4B
  base_url: http://localhost:8000/v1
memory:
  agent: messages
  system: none
archive:
  window: post_first_tool
agents:
- id: planner
  kind: planner
  role: planner
  skills: []
  tools: [wikipedia_search, google_search, web_search, python_coder, think]
  trainable: true
  memory_scope: none
  system_prompt: ''
  model: inherit
  profile: {}
  meta: {}
- {id: wikipedia_search, kind: tool, trainable: true}
- {id: google_search, kind: tool, trainable: true}
- {id: web_search, kind: tool, trainable: true}
- {id: python_coder, kind: tool, trainable: true}
- {id: think, kind: tool, trainable: true}
- id: verifier
  kind: verifier
  trainable: false
  system_prompt: 'Judge whether the sub-goal is complete from the tool-agent output; output JSON only.'
routers:
- id: route_exec
  candidates: [wikipedia_search, google_search, web_search, python_coder, think]
  strategy: from_plan
  output_contract: json
edges:
- {from: planner, to: route_exec, kind: route}
- {from: route_exec, to: verifier, kind: message}
- {from: verifier, to: planner, kind: feedback}
sampling:
  mode: arpo
  group_n: 4
  beam_size: 2
  initial_rollouts: 2
  max_branch_depth: 2
  expand_in_runner: true
  barriers: []
  sites:
  - id: site_after_tool_planner_python_coder
    enabled: true
    anchor:
      kind: after_tool
      agent_id: planner
      tool_id: python_coder
      edge_id: null
    when: first
    nth: 1
    gate: {type: always, params: {}}
    fork:
      beam_size: 3
      share_observation: true
      resume_mode: messages
      probe_max_tokens: 128
    reward:
      scheme: scalar_grpo
      p_plus: 0.8
      k_min: 2
      epsilon_f: 0.001
    priority: 10
