schema_version: '0.3'
topology: hub_react
hub:
  role: orchestrator
  skills:
  - react_loop
  verify: null
  max_feedback_hops: 1
  system_prompt: ''
tools:
- web_search
- wikipedia_search
- execute_python
llm:
  kind: api
  model: qwen3.5-27b
  base_url: https://www.dmxapi.cn/v1/
memory:
  agent: messages
  system: none
archive:
  window: post_first_tool
entry_agent: hub
agents:
- id: hub
  role: orchestrator
  skills:
  - react_loop
  tools:
  - web_search
  - wikipedia_search
  - execute_python
  trainable: true
  kind: hub
  memory_scope: agent
  system_prompt: ''
  model: inherit
  profile: {}
  meta: {}
edges:
- from: hub
  to: web_search
  kind: tool_call
  meta:
    ui:
      sourceHandle: bottom
      targetHandle: top
- from: hub
  to: wikipedia_search
  kind: tool_call
  meta:
    ui:
      sourceHandle: bottom
      targetHandle: top
- from: hub
  to: execute_python
  kind: tool_call
  meta:
    ui:
      sourceHandle: right
      targetHandle: left
sampling:
  mode: arpo
  group_n: 4
  beam_size: 2
  initial_rollouts: 2
  max_branch_depth: 2
  expand_in_runner: true
  barriers: []
  sites:
  - id: site_after_tool_hub_execute_python
    enabled: true
    anchor:
      kind: after_tool
      agent_id: hub
      tool_id: execute_python
      edge_id: null
    when: first
    nth: 1
    gate:
      type: always
      params: {}
    fork:
      beam_size: 3
      share_observation: true
      resume_mode: messages
      probe_max_tokens: 128
    reward:
      scheme: scalar_grpo
      p_plus: 0.8
      k_min: 2
      epsilon_f: 0.001
    priority: 10
  - id: site_tool_result_hub_tool_id_wikipedia_search
    enabled: true
    anchor:
      kind: after_tool
      agent_id: hub
      tool_id: wikipedia_search
      edge_id: null
    when: every
    nth: 1
    gate:
      type: always
      params: {}
    fork:
      share_observation: true
      resume_mode: messages
      probe_max_tokens: 128
    reward:
      scheme: scalar_grpo
      p_plus: 0.8
      k_min: 2
      epsilon_f: 0.001
      dead_end_backprop: 1
    priority: 10
  - id: site_tool_result_hub_tool_id_web_search
    enabled: true
    anchor:
      kind: after_tool
      agent_id: hub
      tool_id: web_search
      edge_id: null
    when: every
    nth: 1
    gate:
      type: always
      params: {}
    fork:
      share_observation: true
      resume_mode: messages
      probe_max_tokens: 128
      beam_size: 1
    reward:
      scheme: scalar_grpo
      p_plus: 0.8
      k_min: 2
      epsilon_f: 0.001
      dead_end_backprop: 1
    priority: 10
routers: []
