label: Router 候选含空白 Agent
schema_version: "0.3"
topology: centralized
entry_agent: planner
hub:
  role: planner
  skills: []
tools:
  - python_coder
agents:
  - id: planner
    kind: planner
    role: planner
    system_prompt: "在 python_coder 与 summarizer 之间选择。只输出 JSON：next, args, sub_goal, done。"
    tools:
      - python_coder
    trainable: true
  - id: python_coder
    kind: tool
    trainable: false
  - id: summarizer
    kind: blank
    system_prompt: "Summarize the tool output. Output JSON {\"output\": string}."
    trainable: true
    profile:
      input_schema:
        type: object
        properties:
          input:
            type: string
        required:
          - input
      output_schema:
        type: object
        properties:
          output:
            type: string
        required:
          - output
  - id: verifier
    kind: verifier
    trainable: true
    system_prompt: "根据 tool-agent 输出判断子目标是否完成，只输出 JSON。"
routers:
  - id: route_exec
    candidates:
      - python_coder
      - summarizer
    strategy: from_plan
    output_contract: json
edges:
  - from: planner
    to: route_exec
    kind: route
  - from: route_exec
    to: verifier
    kind: message
  - from: verifier
    to: planner
    kind: feedback
